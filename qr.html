<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070E18">
<title>Inquadra e rispondi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ground:#070E18; --text:#EAF4FE; --muted:#7FA6C0; --dim:#5C7F98;
  --accent:#00C8F0; --line:rgba(120,170,205,.18);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; background:var(--ground); color:var(--muted);
  font-family:var(--sans); display:grid; place-items:center; padding:5vmin;
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(circle at 14% 12%,rgba(0,200,240,.14),transparent 40%),
             radial-gradient(circle at 86% 88%,rgba(93,212,154,.09),transparent 38%);
}
.card {
  position:relative; display:flex; align-items:center; gap:6vmin;
  flex-wrap:wrap; justify-content:center; text-align:left; max-width:1100px;
}
.copy { flex:1 1 340px; min-width:0; display:flex; flex-direction:column; gap:20px; }
.mark {
  align-self:flex-start; display:inline-flex; align-items:center; gap:9px;
  font:500 clamp(10px,1.1vmin,12px)/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); border:1px solid rgba(0,200,240,.34); background:rgba(0,200,240,.07);
  border-radius:5px; padding:9px 13px;
}
.mark::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 9px var(--accent); }
h1 {
  font-family:var(--serif); font-weight:400; font-size:clamp(40px,7.6vmin,86px);
  line-height:1.02; color:var(--text); margin:0; text-wrap:balance;
}
h1 em { font-style:italic; color:var(--accent); }
p { margin:0; font-size:clamp(15px,2.1vmin,21px); max-width:34ch; }
.url {
  font:500 clamp(12px,1.7vmin,17px)/1.4 var(--mono); color:var(--text);
  border-top:1px solid var(--line); padding-top:18px; word-break:break-all;
}
.url span { display:block; font-size:.72em; color:var(--dim); letter-spacing:.13em; text-transform:uppercase; margin-bottom:8px; }
.qr-frame {
  flex:0 0 auto; padding:clamp(14px,2vmin,24px); border-radius:16px;
  background:#F4FAFF; box-shadow:0 24px 70px rgba(0,0,0,.45);
}
.qr { display:block; width:clamp(200px,38vmin,380px); height:auto; }
@media (max-width:700px) { .card { flex-direction:column-reverse; } .copy { text-align:center; align-items:center; } .mark { align-self:center; } p { text-align:center; } }
</style>
</head>
